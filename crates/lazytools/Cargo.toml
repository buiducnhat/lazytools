[package]
name = "lazytools"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A terminal utility belt — offline, keyboard-first. TUI plus CLI subcommands in one binary."
readme = "../../README.md"
keywords = ["tui", "cli", "terminal", "devtools", "utilities"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
lazytools-core.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
# crossterm is NOT declared directly — use `ratatui::crossterm` so versions can't drift apart.
ratatui.workspace = true
bitflags.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
nucleo.workspace = true
arboard.workspace = true
# The OSC 52 clipboard fallback encodes its payload — already in the tree via
# lazytools-core, so this adds no crate to the build.
base64.workspace = true
toml.workspace = true
serde.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
md-5.workspace = true
hex.workspace = true
