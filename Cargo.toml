[workspace]
resolver = "3"
members = ["crates/lazytools-core", "crates/lazytools"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
lazytools-core = { path = "crates/lazytools-core" }

thiserror = "2.0"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"

# feature `string`: cho phép tên arg / default_value dựng lúc chạy từ registry.
# Không dùng `derive` — subcommand sinh động nên toàn bộ là builder API.
clap = { version = "4.6", features = ["string"] }
anyhow = "1.0"
serde_json = "1.0"

assert_cmd = "2"
