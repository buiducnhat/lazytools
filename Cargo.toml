[workspace]
resolver = "3"
members = ["crates/lazytools-core", "crates/lazytools"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/buiducnhat/lazytools"
# Required by the generated Homebrew formula — dist warns without it.
homepage = "https://github.com/buiducnhat/lazytools"

[workspace.dependencies]
# `version` is required alongside `path`: crates.io rejects a bare path dependency.
# Cargo builds locally from the path and publishes the version.
lazytools-core = { path = "crates/lazytools-core", version = "0.5.0" }

thiserror = "2.0"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"

# feature `string`: allows arg names / default_value to be built at runtime from the registry.
# Not using `derive` — subcommands are generated dynamically, so it's all builder API.
hmac = "0.13"
bcrypt = "0.19"
base64 = "0.23"
serde_yaml_ng = "0.10"
csv = "1.4"
urlencoding = "2"

clap = { version = "4.6", features = ["string"] }
anyhow = "1.0"
# `preserve_order`: keeps the user's key order. Without it, `serde_json::Map` is a
# BTreeMap and the format tool would **silently reorder** the user's keys — for a
# formatting tool, that's a bug, not a detail.
serde_json = { version = "1.0", features = ["preserve_order"] }

ratatui = "0.30"
bitflags = "2"
nucleo = "0.5"
# default-features off: drops `image-data` (which pulls in `image`/`tiff`) — text-only copy.
arboard = { version = "3.6", default-features = false }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
unicode-segmentation = "1"
unicode-width = "0.2"

rand = "0.10"
uuid = { version = "1.24", features = ["v4", "v7"] }
ulid = "3.0"

# `cron 0.17` depends on chrono, so chrono is coming into the binary either way.
# Using jiff for `web.timestamp` would mean shipping **two** date libraries to serve
# two tools — hence chrono for both. default-features off drops `oldtime`/`wasmbind`;
# `clock` is what provides "now" and the local timezone.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cron = "0.17"
url = "2.5"
similar = "3.1"
# default-features off drops `perf-dfa-full` and the Unicode tables `text.regex` has no
# use for; `std` + `unicode` + `perf` is what a pattern typed into a form actually needs.
regex = { version = "1.11", default-features = false, features = [
  "std",
  "perf",
  "unicode",
] }

assert_cmd = "2"
insta = "1.48"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
