[workspace]
resolver = "3"
members = ["crates/lazytools-core", "crates/lazytools"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
lazytools-core = { path = "crates/lazytools-core" }

thiserror = "2.0"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"

# feature `string`: cho phép tên arg / default_value dựng lúc chạy từ registry.
# Không dùng `derive` — subcommand sinh động nên toàn bộ là builder API.
hmac = "0.13"
bcrypt = "0.19"
base64 = "0.23"
serde_yaml_ng = "0.10"
csv = "1.4"
urlencoding = "2"

clap = { version = "4.6", features = ["string"] }
anyhow = "1.0"
# `preserve_order`: giữ nguyên thứ tự khóa của người dùng. Không có nó,
# `serde_json::Map` là BTreeMap và tool format sẽ **sắp xếp lại khóa** của
# người ta một cách âm thầm — với tool định dạng thì đó là lỗi, không phải chi tiết.
serde_json = { version = "1.0", features = ["preserve_order"] }

ratatui = "0.30"
bitflags = "2"
nucleo = "0.5"
# default-features tắt: bỏ `image-data` (kéo theo `image`/`tiff`) — chỉ copy text.
arboard = { version = "3.6", default-features = false }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
unicode-segmentation = "1"
unicode-width = "0.2"

assert_cmd = "2"
insta = "1.48"
